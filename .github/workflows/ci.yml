# push と Pull Request のたびに、整形・lint・テスト・ビルドを確かめる。
# チェックが通ったら、Supabase（migrationsの適用・結合テスト）と E2E を動かし、
# main への push では両方が通ったあと Cloudflare Pages にデプロイする。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: チェック
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 依存パッケージのインストール
        run: npm ci

      - name: 整形チェック
        run: npm run format:check

      - name: lint（依存の向きのルールを含む）
        run: npm run lint

      - name: テスト
        run: npm test

      - name: ビルド（型チェックを含む）
        run: npm run build

      - name: tokens.css が tokens.json から作ったものと一致するか
        run: |
          npm run design:tokens
          git diff --exit-code -- src/ui/design-system/tokens.css || {
            echo "::error file=src/ui/design-system/tokens.css::tokens.css が tokens.json と食い違っています。npm run design:tokens を実行してコミットしてください"
            exit 1
          }

      - name: マスターデータが md から作ったものと一致するか
        run: |
          npm run master-data
          git diff --exit-code -- src/personalMission/masterData src/missionCandidate/masterData || {
            echo "::error::マスターデータが md と食い違っています。npm run master-data を実行してコミットしてください"
            exit 1
          }

  supabase:
    name: Supabase（migrations・結合テスト）
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 依存パッケージのインストール
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: ローカルのSupabase（Docker）を起動し、migrationsを適用する
        run: supabase start

      - name: migrationsが問題なく適用できるか確認する（db reset）
        run: supabase db reset

      - name: 結合テスト（Supabase*Repositoryが実際のPostgresで動くか）
        run: npm run test:integration

  e2e:
    name: 画面の自動テスト（E2E）
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 依存パッケージのインストール
        run: npm ci

      # Chromium は Playwright の版が変わらない限り再利用する
      - name: Chromium のキャッシュ
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Chromium のインストール
        run: npx playwright install --with-deps --only-shell chromium

      - name: E2E テスト（本番用のビルドを相手にする）
        run: npm run e2e

      - name: 失敗したときの報告と記録を残す
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  deploy:
    name: Cloudflare Pages にデプロイ
    needs: [check, supabase, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 依存パッケージのインストール
        run: npm ci

      - name: ビルド
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: デプロイ
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name genchigenpo --branch main --commit-hash "$GITHUB_SHA" --commit-message "$GITHUB_SHA"
